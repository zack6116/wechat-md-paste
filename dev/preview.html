<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>导入预览</title>
    <link rel="stylesheet" href="/src/panel/panel.css">
    <style>
      body { margin: 0; background: #eef1f4; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1a1a1a; }
      .toolbar { display: flex; gap: 8px; align-items: center; padding: 16px 20px; }
      button { border: 0; border-radius: 8px; padding: 8px 12px; background: #1a1a1a; color: #fff; cursor: pointer; }
      #status { color: #555; font-size: 13px; }
      .editor { width: min(440px, calc(100% - 40px)); margin: 8px auto 80px; background: #fff; min-height: 640px; padding: 28px 24px 48px; box-shadow: 0 8px 30px rgba(0,0,0,.06); }
      .editor h2 { margin: 0 0 16px; font-size: 22px; }
      #cover { margin: 0 0 12px; color: #078d46; font-size: 13px; }
      #panel-root { position: fixed; top: 80px; right: 24px; width: 208px; height: 56px; z-index: 5; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="sample" type="button">导入示例</button>
      <button id="remote" type="button">导入一张网络图片</button>
      <span id="status"></span>
    </div>
    <article class="editor">
      <h2 id="title">标题会显示在这里</h2>
      <p id="cover"></p>
      <div id="body"><p style="color:#999">导入后的正文会出现在这里。这是本地预览，不是公众号编辑器。</p></div>
    </article>
    <div id="panel-root"></div>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
