<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="title desc">
  <title id="title">公众号 MD Paste</title>
  <desc id="desc">在公众号图文编辑页把 Markdown 写进草稿。右侧用示例稿画出绿色左边线小标题和引用，不是公众号后台截图。</desc>

  <rect width="1200" height="440" rx="28" fill="#f3f7f4"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
    <text x="56" y="72" fill="#078d46" font-size="18" font-weight="600">Chrome 扩展 · 图文草稿</text>
    <text x="56" y="158" fill="#1a1a1a" font-size="64" font-weight="700">公众号</text>
    <text x="56" y="230" fill="#1a1a1a" font-size="64" font-weight="700">MD Paste</text>
    <text x="56" y="300" fill="#3a3a3c" font-size="22">把 Markdown 写进当前草稿。</text>
    <text x="56" y="334" fill="#3a3a3c" font-size="22">图片按原位置放入，不替你发表。</text>
    <text x="56" y="392" fill="#6b6b70" font-size="18">本地处理 · 不读取 Cookie</text>
  </g>

  <g id="draft-specimen" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
    <rect x="652" y="48" width="492" height="344" rx="22" fill="#ffffff" stroke="#d7e8dc" stroke-width="1"/>
    <text x="676" y="86" fill="#078d46" font-size="18" font-weight="600">导入后的样式</text>

    <rect x="676" y="104" width="444" height="96" rx="8" fill="#f7f7f7"/>
    <text x="696" y="142" fill="#333333" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">## 你可以带走什么</text>
    <text x="696" y="174" fill="#333333" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">- 标题、列表和引用</text>

    <rect x="676" y="224" width="4" height="28" rx="1" fill="#07c160"/>
    <text x="692" y="246" fill="#222222" font-size="26" font-weight="700">你可以带走什么</text>

    <circle cx="686" cy="286" r="4.5" fill="#07c160"/>
    <text x="704" y="292" fill="#333333" font-size="20">标题、列表和引用会保留</text>

    <rect x="676" y="316" width="444" height="52" rx="6" fill="#f7f8fa"/>
    <rect x="676" y="316" width="4" height="52" fill="#07c160"/>
    <text x="696" y="348" fill="#555555" font-size="20">只写入草稿，不替你发表。</text>
  </g>
</svg>
